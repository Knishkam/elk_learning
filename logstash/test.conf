input {
  file {
    path => "/usr/share/logstash/logs-in/app.logs"
    start_position => "beginning"
    sincedb_path => "/usr/share/logstash/sincedb/app_logs.db"
    type => "plain"
  }
  file {
    path => "/usr/share/logstash/logs-in/app.jsonl"
    start_position => "beginning"
    sincedb_path =>"/usr/share/logstash/sincedb/app_jsonl.db"
    type => "json"
  }
}

filter {
  if [type] == "plain" {
    mutate { gsub => ["message", "\r", ""] }
    grok {
      match => { "message" => "%{TIMESTAMP_ISO8601:ts} \[%{WORD:service}\] %{LOGLEVEL:level} status=%{NUMBER:status_code:int} %{GREEDYDATA:msg}" }
    }
    date { match => ["ts", "yyyy-MM-dd HH:mm:ss"] target => "@timestamp" }
  } else if [type] == "json" {
    json { source => "message" }
    date { match => ["ts", "ISO8601"] target => "@timestamp" }
  }
  mutate { remove_field => ["ts"] }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "logstash_app_logs"
  }
  stdout { codec => rubydebug }
}