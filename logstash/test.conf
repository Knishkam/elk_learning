input {
    file {
        path => "/usr/share/logstash/logs-in/app.logs"
        start_position => "beginning"
        sincedb_path => "/dev/null"
    }
}

filter {
    mutate { gsub => ["message", "\r", ""] }
    dissect {
        mapping => {
            "message" => "%{ts} %{level} %{service} %{msg}"
        }
    }
    date {
        match => ["ts", "ISO8601"]
        target => "@timestamp"
    }

    mutate {
        remove_field => ["ts"]
    }
}

output {
    elasticsearch {
        hosts => ["http://elasticsearch:9200"]
        index => "logstash_app_logs"
    }
    stdout { codec => rubydebug }
}